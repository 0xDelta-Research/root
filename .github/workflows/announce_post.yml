name: Announce New Report

# Dispara depois que o deploy termina com sucesso, para que o link
# do relatório já esteja no ar quando a mensagem chegar no Discord.
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

jobs:
  announce:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Detect newly published reports
        id: detect
        run: |
          # Num commit de merge, HEAD^ é a main antes do merge, então o diff
          # traz exatamente os arquivos que o PR adicionou.
          FILES=$(git diff --diff-filter=A --name-only HEAD^ HEAD -- src/content/blog \
                  | grep '/index\.md$' || true)
          if [ -z "$FILES" ]; then
            echo "Nenhum relatório novo neste deploy."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Relatórios novos:"
            echo "$FILES" | sed 's/^/  /'
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: pip install requests

      - name: Announce on Discord
        if: steps.detect.outputs.found == 'true'
        env:
          DISCORD_TOKEN:       ${{ secrets.DISCORD_TOKEN }}
          RESEARCH_CHANNEL_ID: ${{ secrets.RESEARCH_CHANNEL_ID }}
          # Vai por env em vez de ser interpolado direto no shell: assim um
          # nome de arquivo malicioso nao consegue injetar comando.
          NEW_REPORTS:         ${{ steps.detect.outputs.files }}
        run: |
          echo "$NEW_REPORTS" | xargs python 0xdelta_announce_bot.py
