name: Deploy to GitHub Pages

on:
  # Dispara sempre que algo entra na branch 'main'
  push:
    branches: [ main ]
  # Permite rodar manualmente na aba Actions
  workflow_dispatch:

# Permissões necessárias
permissions:
  contents: read
  pages: write
  id-token: write

# Impede deploys simultâneos bagunçados. Não cancela o que está em andamento:
# um deploy interrompido no meio deixa o ambiente "cancelled" (padrão do
# starter oficial do GitHub Pages).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      # O Astro Action faz todo o trabalho pesado
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
            package-manager: npm
            # Igual ao node-version do ci.yml
            node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
