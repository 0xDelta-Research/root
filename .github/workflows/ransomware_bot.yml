name: 0xDelta Ransomware Tracker

on:
  schedule:
    - cron: '45 * * * *'   # toda hora e 45min (offset dos outros bots)
  workflow_dispatch:

jobs:
  run-ransomware-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Restore ransomware seen cache
        uses: actions/cache@v4
        with:
          path: seen_ransomware.json
          key: seen-ransomware-${{ github.run_id }}
          restore-keys: seen-ransomware-

      - name: Run ransomware tracker
        env:
          DISCORD_TOKEN:          ${{ secrets.DISCORD_TOKEN }}
          RANSOMWARE_CHANNEL_ID:  ${{ secrets.RANSOMWARE_CHANNEL_ID }}
        run: python 0xdelta_ransomware_bot.py --quiet --min-impact MEDIUM
