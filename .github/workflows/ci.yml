name: CI

# The deploy workflow only fires on push to main, so until now nothing built a
# change before it landed — a broken build was only visible after the merge.
# This builds every pull request first.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Must match node-version in main.yml: a green check here only means the
      # deploy will build if both run the same Node.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # npm ci, not npm install: it fails on a lockfile that drifted from
      # package.json instead of quietly resolving something else.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # A broken markdown/Shiki setup can render every report with an empty
      # body while the build still succeeds (happened in June 2026).
      - name: Check report bodies rendered
        run: |
          empty=$(grep -lE 'id="article-body">\s*</div>' -r dist/blog --include=index.html || true)
          if [ -n "$empty" ]; then echo "Empty report body:"; echo "$empty"; exit 1; fi
